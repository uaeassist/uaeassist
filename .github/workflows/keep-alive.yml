name: Keep Groq Keys Alive

on:
  schedule:
    - cron: '0 10 * * *'  # Runs every day at 10am UTC
  workflow_dispatch:       # Lets you run it manually anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all Groq keys
        run: |
          for KEY in "${{ secrets.GROQ_KEY_1 }}" "${{ secrets.GROQ_KEY_2 }}" "${{ secrets.GROQ_KEY_3 }}" "${{ secrets.GROQ_KEY_4 }}" "${{ secrets.GROQ_KEY_5 }}"; do
            curl -s -o /dev/null https://api.groq.com/openai/v1/chat/completions \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d '{"model":"llama-3.3-70b-versatile","messages":[{"role":"user","content":"hi"}],"max_tokens":1}'
            echo "Pinged key successfully"
          done
